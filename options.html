<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>X Reply Name Grabber 設定</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; }
    h2 { margin-top: 0; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
    button { padding: 10px 15px; background-color: #1d9bf0; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    button:hover { background-color: #1a8cd8; }
    #status { margin-top: 10px; color: #008000; height: 20px;}
  </style>
</head>
<body>
  <h2>設定</h2>
  <div>
    <label for="prefix">名前の前に付ける文言</label>
    <input type="text" id="prefix" placeholder="こんばんは、" />
  </div>
  <div>
    <label for="suffix">名前の後ろに付ける文言</label>
    <input type="text" id="suffix" placeholder="さん。" />
  </div>
  <button id="save">保存</button>
  <div id="status"></div>
  <hr style="margin: 20px 0; border: none; border-top: 1px dashed #ccc;">
  <p style="font-size: 13px; color: #666; margin-bottom: 10px;">ショートカットキーが動作しない、または変更したい場合はこちら↓</p>
  <button id="open-shortcuts" style="background-color: #536471; margin-bottom: 20px;">⌨️ ショートカットキーを変更する</button>
  
  <script src="options.js"></script>
</body>
</html>
